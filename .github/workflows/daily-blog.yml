name: Daily Blog Post

on:
  schedule:
    - cron: '41 5 * * *'   # 05:41 UTC – krumme Minute: zur vollen Stunde startet GitHub Läufe oft Stunden zu spät
  workflow_dispatch:        # manual trigger via GitHub UI

permissions:
  contents: write           # needed to push posts.json back to repo

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic --quiet

      - name: Generate blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 generate_post.py

      - name: Commit and push
        id: commit
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "PPA Blog Bot"
          git add html/posts.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto: Blog post $(date +%Y-%m-%d)"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

  # Deploy direkt als aufgerufener Workflow (zuverlässiger als „gh workflow run“, das am 2.11. fehlschlug)
  deploy:
    needs: generate
    if: needs.generate.outputs.pushed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main
    secrets: inherit
